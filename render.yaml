services:
  - type: web
    name: meu-hacker-machine-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EXERCISES_DIR
        value: /app/exercises

  - type: web
    name: meu-hacker-machine-web
    runtime: static
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://meu-hacker-machine-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
