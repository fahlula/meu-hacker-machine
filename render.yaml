services:
  - type: web
    name: meu-hacker-machine-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EXERCISES_DIR
        value: /app/exercises

  - type: web
    name: meu-hacker-machine-web
    runtime: static
    buildCommand: |
      cd frontend
      npm install --legacy-peer-deps
      VITE_API_URL="https://${API_HOST}/api" npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: meu-hacker-machine-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
